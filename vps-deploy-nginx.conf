# =========================================================
# Finder Portal - Nginx Location Blocks for Linux VPS
# Copy and insert these blocks into your main Nginx server block
# located at /etc/nginx/sites-available/default
# =========================================================

# 1. Route for static React Frontend (ex: https://your-domain.com/project)
location /project {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    
    # Enable fallback for React single page routing history state
    try_files $uri $uri/ /index.html;
}

# 2. Route for Express Rest API (ex: https://your-domain.com/project/api/v1/items)
location /project/api {
    # Strip '/project/api' and rewrite to '/api' for backend compatibility
    rewrite ^/project/api/(.*)$ /api/$1 break;
    
    proxy_pass http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}
